<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-labelledby="title desc">
<title id="title">From input to useful on-device software</title>
<desc id="desc">Text, camera frames and documents feed local model inference, which powers chat, voice guidance and application features. A diagram of my engineering interests.</desc>
<g font-family="ui-monospace,SFMono-Regular,Consolas,monospace"><path d="M1 1H899M1 179H899" stroke="#C7D1CA"/>
