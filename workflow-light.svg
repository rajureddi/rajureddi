<text x="14" y="75" font-size="11" letter-spacing="1" fill="#5E6C64">01 / INPUT</text>
<text x="14" y="101" font-size="18" fill="#25332D">Text · camera</text>
<text x="14" y="125" font-size="18" fill="#25332D">Documents</text>
<text x="344" y="75" font-size="11" letter-spacing="1" fill="#5E6C64">02 / LOCAL INFERENCE</text>
<text x="344" y="101" font-size="18" fill="#25332D">Models +</text>
