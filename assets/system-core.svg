<title id="title">System core: from the real world to on-device action</title>
<desc id="desc">Camera and sensors feed perception using CV, OCR and VLM. An intelligence core uses LLM, ML and logic. Android delivers offline, private interaction. Cloud is an optional extension.</desc>
